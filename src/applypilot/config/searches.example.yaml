# ApplyPilot search configuration
# Copy to ~/.applypilot/searches.yaml and customize for your job search.
# The wizard (applypilot init) generates a basic version automatically.

# Select Europe-oriented registry additions. Important geography is always
# configured explicitly; it is never inferred from IP address or system locale.
search_profile: eu

# Priority companies are searched first and highlighted in status/dashboard.
# Matching is exact after case, punctuation, and whitespace normalization.
watchlist:
  - "JetBrains"
  - "GitLab"
  - "Grafana Labs"
  - "Cloudflare"
  - "Elastic"
  - "Datadog"

# Deterministic ranking weights. Closely related technical and geography
# signals use their strongest contribution rather than stacking.
ranking:
  weights:
    python: 3
    ruby: 3
    elixir: 3
    go: 3
    rust: 3
    typescript_javascript: 3
    unpreferred_language: -2
    backend: 3
    germany: 3
    europe: 2
    remote: 2
    relocation: 1.5
    salary: 1
    watchlist: 2

# Limit paid LLM scoring to the strongest deterministic candidates. Watchlist
# jobs always remain eligible regardless of score.
scoring:
  min_discovery_score: 5
  shortlist_limit: 100
  preferred_title_phrases:
    - "backend"
    - "python"
    - "ruby"
    - "elixir"
    - "golang"
    - "rust"
    - "typescript"
    - "javascript"
    - "full stack"
    - "fullstack"
    - "software engineer"
    - "software developer"
    - "product engineer"
    - "platform engineer"
    - "infrastructure engineer"
    - "site reliability engineer"
    - "devops engineer"
    - "technical lead"
    - "software architect"

# Bound fallback detail-extraction prompts for pages without structured data.
enrichment:
  llm_max_input_chars: 12000

# Expensive broad sources should use only precise queries. Workday accepts an
# explicit deduplicated query list; Smart Extract defaults to tier 1.
workday_queries:
  - "backend engineer"
  - "python developer"
  - "full stack engineer"
smart_extract_max_tier: 1

# Search queries -- each has a query string and priority tier.
# Tier 1: High-priority exact matches (searched first, highest precision)
# Tier 2: Strong matches, broader scope
# Tier 3: Wide net, high volume, lower precision
queries:
  - query: "software engineer"
    tier: 1
  - query: "backend engineer"
    tier: 1
  - query: "backend developer"
    tier: 1
  - query: "full stack developer"
    tier: 2
  - query: "full stack engineer"
    tier: 2
  - query: "python developer"
    tier: 2
  - query: "python engineer"
    tier: 2
  - query: "ruby engineer"
    tier: 2
  - query: "elixir engineer"
    tier: 2
  - query: "golang engineer"
    tier: 2
  - query: "rust engineer"
    tier: 2
  - query: "typescript engineer"
    tier: 2
  - query: "DevOps engineer"
    tier: 2
  - query: "site reliability engineer"
    tier: 2
  - query: "platform engineer"
    tier: 2
  - query: "cloud engineer"
    tier: 2
  - query: "data engineer"
    tier: 2
  - query: "infrastructure engineer"
    tier: 2
  - query: "software developer"
    tier: 3
  - query: "developer"
    tier: 3
  - query: "systems engineer"
    tier: 3
  - query: "automation engineer"
    tier: 3
  - query: "solutions engineer"
    tier: 3
  - query: "integration engineer"
    tier: 3
  - query: "ML engineer"
    tier: 3
  - query: "machine learning engineer"
    tier: 3
  - query: "AI engineer"
    tier: 3
  - query: "security engineer"
    tier: 3

# Active location labels (subset of the full locations list below that runs each crawl).
# Remove or comment labels to disable those searches.
location_labels:
  - hamburg
  - berlin
  - munich
  - germany_remote
  - netherlands_remote
  - ireland_remote
  - france_remote
  - sweden_remote
  - europe_linkedin

# Locations to search. Each entry may include country_indeed to hit the right
# national Indeed portal. LinkedIn is always searched Worldwide for "Europe".
locations:
  # Local city anchors
  - label: hamburg
    location: "Hamburg, Germany"
    remote: false
    country_indeed: germany
  - label: berlin
    location: "Berlin, Germany"
    remote: false
    country_indeed: germany
  - label: munich
    location: "Munich, Germany"
    remote: false
    country_indeed: germany
  # Remote by country (each hits a different national Indeed portal)
  - label: germany_remote
    location: "Germany"
    remote: true
    country_indeed: germany
  - label: netherlands_remote
    location: "Netherlands"
    remote: true
    country_indeed: netherlands
  - label: ireland_remote
    location: "Ireland"
    remote: true
    country_indeed: ireland
  - label: france_remote
    location: "France"
    remote: true
    country_indeed: france
  - label: sweden_remote
    location: "Sweden"
    remote: true
    country_indeed: sweden
  # LinkedIn Worldwide (covers all EU; LinkedIn converts "Europe" → Worldwide)
  - label: europe_linkedin
    location: "Europe"
    remote: true

# Location filtering -- non-remote jobs must match an accepted location.
location_accept:
  - "Hamburg"
  - "Berlin"
  - "Munich"
  - "München"
  - "Germany"
  - "Deutschland"
  - "Netherlands"
  - "Amsterdam"
  - "Ireland"
  - "Dublin"
  - "France"
  - "Paris"
  - "Sweden"
  - "Stockholm"
  - "Austria"
  - "Belgium"
  - "Denmark"
  - "Finland"
  - "Poland"
  - "Portugal"
  - "Spain"
  - "Italy"
  - "Switzerland"
  - "Czech Republic"
  - "Czechia"
  - "Norway"
  - "Romania"

location_reject_non_remote:
  - "Serbia"
  - "United States"
  - "USA"
  - "Canada"
  - "India"
  - "Philippines"
  - "Australia"

# Optional restrictions that also apply to remote roles. A remote posting with
# no stated geography is retained for later review; explicit incompatible
# regions are rejected during discovery.
location_reject_remote:
  - "Serbia"
  - "United States"
  - "USA"
  - "US"
  - "Canada"
  - "North America"
  - "Americas"
  - "India"
  - "Philippines"
  - "Australia"
  - "APAC"

# JobSpy source boards
sites:
  - indeed
  - linkedin

# Search defaults
defaults:
  results_per_site: 50   # Max results per board per query
  hours_old: 72          # Only jobs posted within this many hours
  country_indeed: germany
  source_timeout_seconds: 30
  source_max_retries: 1

# Negative keywords -- skip jobs with these in the title (case-insensitive)
exclude_titles:
  - "senior director"
  - "VP "
  - "vice president"
  - "chief"
  - "intern"
  - "internship"
  - "co-op"
  - "clearance required"
  - "TS/SCI"
  - "principal scientist"
